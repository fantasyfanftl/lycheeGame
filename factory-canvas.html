<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出厂设置 · 关系图 v0.1</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; overflow: hidden;
  background: #FAF9F5; color: #3a2a20;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px; line-height: 1.5;
  height: 100vh;
}
a { color: #C15F3C; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ==== 顶部工具栏 ==== */
#toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 20;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: #F4EEE0; border-bottom: 1px solid #E0D4BE;
}
#toolbar .title { font-size: 14px; font-weight: 600; color: #C15F3C; }
#toolbar .badge { font-size: 11px; color: #7d6b5a; background: rgba(217,119,87,0.12); padding: 2px 8px; border-radius: 10px; }
#toolbar select, #toolbar .btn {
  font-size: 12px; padding: 4px 10px; border: 1px solid #D0C0A8;
  background: #FAF9F5; color: #3a2a20; border-radius: 4px; cursor: pointer;
}
#toolbar select:hover, #toolbar .btn:hover { background: #F4EEE0; }
#toolbar .spacer { flex: 1; }
#toolbar .count { font-size: 11px; color: #7d6b5a; }

/* ==== SVG canvas ==== */
#canvas {
  position: fixed; top: 48px; left: 0; right: 0; bottom: 100px;
  width: 100%; cursor: default;
  background:
    radial-gradient(circle at 20% 30%, rgba(217,119,87,0.05) 0, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(125,211,252,0.05) 0, transparent 40%),
    #FAF9F5;
}
.node { cursor: grab; user-select: none; }
.node.dragging { cursor: grabbing; }
.node rect { transition: filter 0.15s, stroke-width 0.15s; }
.node:hover rect { filter: drop-shadow(0 4px 10px rgba(58,42,32,0.15)); }
.node.dim rect { opacity: 0.3; }
.node.dim text { opacity: 0.5; }
.node text { pointer-events: none; }
.node .card-title { font-size: 12px; font-weight: 600; fill: #FAF9F5; }
.node .card-emoji { font-size: 18px; }
.node .sub-badge { font-size: 10px; fill: #FAF9F5; opacity: 0.85; }
.edge { fill: none; stroke-width: 2; opacity: 0.6; }
.edge.dim { opacity: 0.15; }
.edge-label { font-size: 10px; fill: #7d6b5a; pointer-events: none; }
.edge-label.dim { opacity: 0.3; }

/* ==== 抽屉 ==== */
#drawer {
  position: fixed; right: -460px; top: 48px; bottom: 0; width: 440px; z-index: 30;
  background: #FAF9F5; border-left: 1px solid #E0D4BE;
  box-shadow: -6px 0 20px rgba(58,42,32,0.08);
  transition: right 0.28s cubic-bezier(0.4, 0.0, 0.2, 1);
  overflow-y: auto; padding: 20px 22px;
}
#drawer.open { right: 0; }
#drawer .close {
  position: absolute; top: 12px; right: 14px; width: 28px; height: 28px;
  background: transparent; border: 0; font-size: 20px; color: #7d6b5a; cursor: pointer;
}
#drawer .close:hover { color: #C15F3C; }
#drawer h2 { margin: 0 0 4px; font-size: 15px; color: #C15F3C; padding-right: 30px; }
#drawer .type-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 3px; background: rgba(217,119,87,0.12); color: #C15F3C; margin-bottom: 12px; }
#drawer .field { margin-bottom: 14px; }
#drawer .field .label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
  color: #a08872; margin-bottom: 4px; font-weight: 600;
}
#drawer .field .content { font-size: 12.5px; line-height: 1.65; color: #3a2a20; }
#drawer .field .content.solution { font-size: 13px; padding: 8px 10px; background: rgba(217,119,87,0.05); border-left: 3px solid #D97757; border-radius: 3px; }
#drawer .tag {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
  margin: 0 4px 4px 0;
}
#drawer .state-badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 3px; font-weight: 500; }
#drawer .connection-item {
  font-size: 11.5px; padding: 6px 8px; margin: 4px 0;
  background: #F4EEE0; border-radius: 3px; border-left: 2px solid;
}
#drawer .connection-item .direction { font-weight: 600; color: #7d6b5a; margin-right: 4px; }
#drawer .mubu-btn {
  display: block; width: 100%; margin-top: 16px; padding: 10px;
  background: #D97757; color: #FAF9F5; text-align: center; border: 0;
  border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;
  text-decoration: none;
}
#drawer .mubu-btn:hover { background: #C15F3C; text-decoration: none; }
#drawer .mubu-btn:visited { color: #FAF9F5; }

/* ==== 图例 ==== */
#legend {
  position: fixed; bottom: 0; left: 0; right: 0; height: 100px; z-index: 15;
  background: #F4EEE0; border-top: 1px solid #E0D4BE;
  padding: 10px 16px; display: flex; gap: 24px; align-items: flex-start;
  font-size: 11px;
}
#legend .col { flex: 1; }
#legend .col-title { font-size: 10px; text-transform: uppercase; color: #a08872; font-weight: 600; margin-bottom: 6px; }
#legend .item { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; margin-bottom: 3px; }
#legend .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
#legend .swatch.line { height: 3px; width: 20px; border-radius: 0; }
#legend .hint { font-size: 10px; color: #7d6b5a; margin-top: 6px; }

/* ==== 空状态 ==== */
#empty-state {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; color: #a08872;
  display: none;
}
#empty-state.show { display: block; }
</style>
</head>
<body>

<div id="toolbar">
  <span class="title">💎 出厂设置 · 关系图</span>
  <span class="badge" id="version-badge">v0.1</span>
  <select id="filter-theme">
    <option value="all">全部主题</option>
  </select>
  <button class="btn" id="reset-positions">↺ 重置位置</button>
  <div class="spacer"></div>
  <span class="count" id="card-count">加载中...</span>
  <a class="btn" id="long-doc-link" href="#" target="_blank">📄 Q10 长文档</a>
</div>

<svg id="canvas" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-origin" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-trigger" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D97757" />
    </marker>
    <marker id="arrow-deepen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6ee7b7" />
    </marker>
    <marker id="arrow-refute" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-support" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc" />
    </marker>
    <marker id="arrow-related" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
  <g id="edges-layer"></g>
  <g id="nodes-layer"></g>
</svg>

<div id="empty-state">正在加载 factory-cards.json...</div>

<aside id="drawer">
  <button class="close" id="drawer-close">✕</button>
  <div id="drawer-content"></div>
</aside>

<div id="legend">
  <div class="col">
    <div class="col-title">主题</div>
    <div id="legend-themes"></div>
  </div>
  <div class="col">
    <div class="col-title">连线类型</div>
    <div id="legend-connections"></div>
  </div>
  <div class="col">
    <div class="col-title">状态</div>
    <div id="legend-states"></div>
    <div class="hint">💡 拖拽卡片可自由摆位 · 位置本地保存 · 点卡看抽屉</div>
  </div>
</div>

<script>
const NODE_W = 200, NODE_H = 68;
const STORAGE_KEY = 'factory-canvas-positions-v1';
const svgNS = 'http://www.w3.org/2000/svg';

let data = null;
let positions = {};
let currentFilter = 'all';
let selectedCardId = null;

// ==== 加载 ====
async function load() {
  try {
    const res = await fetch('./factory-cards.json?t=' + Date.now());
    data = await res.json();
    positions = loadPositionsFromStorage();
    for (const c of data.cards) {
      if (!positions[c.id]) positions[c.id] = { ...c.initial_position };
    }
    render();
    document.getElementById('empty-state').classList.remove('show');
  } catch (e) {
    document.getElementById('empty-state').textContent = '加载失败:' + e.message;
    document.getElementById('empty-state').classList.add('show');
  }
}

function loadPositionsFromStorage() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function savePositions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
}

// ==== 渲染 ====
function render() {
  document.getElementById('version-badge').textContent = 'v' + data.meta.version;
  document.getElementById('card-count').textContent = `${data.cards.length} 卡 · 阈值 ${data.meta.reconstruction_threshold}`;
  document.getElementById('long-doc-link').href = data.meta.long_docs.Q10.url;

  // 不设 viewBox · SVG 使用 CSS 像素坐标(避免响应式调试模式下 viewBox 计算异常)
  renderFilterOptions();
  renderEdges();
  renderNodes();
  renderLegend();
}

function renderFilterOptions() {
  const sel = document.getElementById('filter-theme');
  sel.innerHTML = '<option value="all">全部主题</option>';
  Object.entries(data.themes).forEach(([id, t]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = `${t.emoji} ${t.name}`;
    sel.appendChild(opt);
  });
  sel.value = currentFilter;
  sel.onchange = () => { currentFilter = sel.value; applyFilter(); };
}

function renderNodes() {
  const layer = document.getElementById('nodes-layer');
  layer.innerHTML = '';
  data.cards.forEach(card => {
    const theme = data.themes[card.primary_theme];
    const pos = positions[card.id];
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('data-id', card.id);
    g.setAttribute('transform', `translate(${pos.x},${pos.y})`);

    const bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('width', NODE_W);
    bg.setAttribute('height', NODE_H);
    bg.setAttribute('rx', 10);
    bg.setAttribute('ry', 10);
    bg.setAttribute('fill', theme.color);
    bg.setAttribute('stroke', darken(theme.color));
    bg.setAttribute('stroke-width', 1.5);
    g.appendChild(bg);

    // emoji
    const emoji = document.createElementNS(svgNS, 'text');
    emoji.setAttribute('class', 'card-emoji');
    emoji.setAttribute('x', 14);
    emoji.setAttribute('y', 28);
    emoji.textContent = theme.emoji;
    g.appendChild(emoji);

    // title
    const title = document.createElementNS(svgNS, 'text');
    title.setAttribute('class', 'card-title');
    title.setAttribute('x', 40);
    title.setAttribute('y', 28);
    title.textContent = card.display_name;
    g.appendChild(title);

    // sub tags row
    if (card.sub_themes && card.sub_themes.length) {
      let x = 14;
      card.sub_themes.forEach(subId => {
        const sub = data.themes[subId];
        if (!sub) return;
        const t = document.createElementNS(svgNS, 'text');
        t.setAttribute('class', 'sub-badge');
        t.setAttribute('x', x);
        t.setAttribute('y', 52);
        t.textContent = `${sub.emoji} ${sub.name}`;
        g.appendChild(t);
        x += 90;
      });
    } else {
      const t = document.createElementNS(svgNS, 'text');
      t.setAttribute('class', 'sub-badge');
      t.setAttribute('x', 14);
      t.setAttribute('y', 52);
      t.setAttribute('opacity', '0.6');
      t.textContent = '· 无副标签';
      g.appendChild(t);
    }

    layer.appendChild(g);
    attachDragAndClick(g, card);
  });
}

function renderEdges() {
  const layer = document.getElementById('edges-layer');
  layer.innerHTML = '';
  data.connections.forEach(conn => {
    const from = positions[conn.from];
    const to = positions[conn.to];
    if (!from || !to) return;
    const type = data.connection_types[conn.type] || data.connection_types.related;

    const x1 = from.x + NODE_W / 2, y1 = from.y + NODE_H / 2;
    const x2 = to.x + NODE_W / 2, y2 = to.y + NODE_H / 2;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;

    // shorten near target so arrow doesn't go inside
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const shortenTo = NODE_H * 0.55;
    const tx = x2 - (dx / len) * shortenTo;
    const ty = y2 - (dy / len) * shortenTo;
    const shortenFrom = NODE_H * 0.55;
    const fx = x1 + (dx / len) * shortenFrom;
    const fy = y1 + (dy / len) * shortenFrom;

    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('class', 'edge');
    path.setAttribute('data-from', conn.from);
    path.setAttribute('data-to', conn.to);
    path.setAttribute('d', `M ${fx} ${fy} Q ${mx} ${my - 20} ${tx} ${ty}`);
    path.setAttribute('stroke', type.color);
    path.setAttribute('marker-end', `url(#arrow-${conn.type})`);
    layer.appendChild(path);

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('class', 'edge-label');
    label.setAttribute('data-from', conn.from);
    label.setAttribute('data-to', conn.to);
    label.setAttribute('x', mx);
    label.setAttribute('y', my - 24);
    label.setAttribute('text-anchor', 'middle');
    label.textContent = conn.label;
    layer.appendChild(label);
  });
}

function renderLegend() {
  const themesDiv = document.getElementById('legend-themes');
  themesDiv.innerHTML = '';
  Object.values(data.themes).forEach(t => {
    themesDiv.innerHTML += `<span class="item"><span class="swatch" style="background:${t.color}"></span>${t.emoji} ${t.name}</span>`;
  });
  const connsDiv = document.getElementById('legend-connections');
  connsDiv.innerHTML = '';
  Object.values(data.connection_types).forEach(c => {
    connsDiv.innerHTML += `<span class="item"><span class="swatch line" style="background:${c.color}"></span>${c.name}</span>`;
  });
  const statesDiv = document.getElementById('legend-states');
  statesDiv.innerHTML = '';
  Object.values(data.states).forEach(s => {
    statesDiv.innerHTML += `<span class="item"><span class="swatch" style="background:${s.color}"></span>${s.name}</span>`;
  });
}

// ==== 拖拽 + 点击 ====
function attachDragAndClick(g, card) {
  let startX, startY, origX, origY, dragging = false, moved = false;

  const onDown = (e) => {
    e.preventDefault();
    const pt = pointerFromEvent(e);
    startX = pt.x; startY = pt.y;
    origX = positions[card.id].x; origY = positions[card.id].y;
    dragging = true; moved = false;
    g.classList.add('dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };
  const onMove = (e) => {
    if (!dragging) return;
    const pt = pointerFromEvent(e);
    const dx = pt.x - startX, dy = pt.y - startY;
    if (!moved && Math.hypot(dx, dy) > 4) moved = true;
    positions[card.id].x = origX + dx;
    positions[card.id].y = origY + dy;
    g.setAttribute('transform', `translate(${positions[card.id].x},${positions[card.id].y})`);
    updateEdgesFor(card.id);
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    g.classList.remove('dragging');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    if (moved) {
      savePositions();
    } else {
      openDrawer(card.id);
    }
  };
  g.addEventListener('pointerdown', onDown);
}

function pointerFromEvent(e) {
  const svg = document.getElementById('canvas');
  const rect = svg.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function updateEdgesFor(cardId) {
  data.connections.forEach(conn => {
    if (conn.from !== cardId && conn.to !== cardId) return;
    const from = positions[conn.from];
    const to = positions[conn.to];
    const x1 = from.x + NODE_W / 2, y1 = from.y + NODE_H / 2;
    const x2 = to.x + NODE_W / 2, y2 = to.y + NODE_H / 2;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const shortenTo = NODE_H * 0.55, shortenFrom = NODE_H * 0.55;
    const tx = x2 - (dx / len) * shortenTo, ty = y2 - (dy / len) * shortenTo;
    const fx = x1 + (dx / len) * shortenFrom, fy = y1 + (dy / len) * shortenFrom;
    const path = document.querySelector(`path.edge[data-from="${conn.from}"][data-to="${conn.to}"]`);
    if (path) path.setAttribute('d', `M ${fx} ${fy} Q ${mx} ${my - 20} ${tx} ${ty}`);
    const label = document.querySelector(`text.edge-label[data-from="${conn.from}"][data-to="${conn.to}"]`);
    if (label) { label.setAttribute('x', mx); label.setAttribute('y', my - 24); }
  });
}

// ==== 抽屉 ====
function openDrawer(cardId) {
  selectedCardId = cardId;
  const card = data.cards.find(c => c.id === cardId);
  if (!card) return;
  const theme = data.themes[card.primary_theme];
  const state = data.states[card.state] || { name: card.state, color: '#94a3b8' };

  const subs = (card.sub_themes || []).map(sid => {
    const t = data.themes[sid];
    return t ? `<span class="tag" style="background:${t.color};color:#fff">${t.emoji} ${t.name}</span>` : '';
  }).join('');

  const inbound = data.connections.filter(c => c.to === cardId);
  const outbound = data.connections.filter(c => c.from === cardId);
  const connsHtml = [
    ...outbound.map(c => {
      const target = data.cards.find(x => x.id === c.to);
      const type = data.connection_types[c.type];
      return `<div class="connection-item" style="border-left-color:${type.color}"><span class="direction">→</span>${c.label} <span style="color:#a08872">· to ${target ? target.display_name : c.to}</span></div>`;
    }),
    ...inbound.map(c => {
      const src = data.cards.find(x => x.id === c.from);
      const type = data.connection_types[c.type];
      return `<div class="connection-item" style="border-left-color:${type.color}"><span class="direction">←</span>${c.label} <span style="color:#a08872">· from ${src ? src.display_name : c.from}</span></div>`;
    })
  ].join('');

  document.getElementById('drawer-content').innerHTML = `
    <h2>${card.display_name}</h2>
    <span class="type-badge">${card.type === 'integration' ? '整合卡' : '原子卡'} · ${card.id}</span>

    <div class="field">
      <div class="label">体系 / 出处</div>
      <div class="content">陪跑 ${card.source_question} 深挖 · 豆包会员 · ${card.created_at}</div>
    </div>

    <div class="field">
      <div class="label">解法原文</div>
      <div class="content solution">${card.solution_summary}</div>
    </div>

    <div class="field">
      <div class="label">我的体感</div>
      <div class="content" style="color:#a08872;font-style:italic">→ 完整体感 + 潜在拆点 在幕布卡片文档内(点下方按钮打开)</div>
    </div>

    <div class="field">
      <div class="label">状态</div>
      <span class="state-badge" style="background:${state.color};color:#3a2a20">${state.name}</span>
    </div>

    <div class="field">
      <div class="label">标签(${1 + (card.sub_themes || []).length} / 3)</div>
      <span class="tag" style="background:${theme.color};color:#fff">${theme.emoji} ${theme.name}(主)</span>
      ${subs}
    </div>

    ${connsHtml ? `<div class="field">
      <div class="label">关系连接(${inbound.length + outbound.length})</div>
      ${connsHtml}
    </div>` : ''}

    <a class="mubu-btn" href="${card.mubu_url}" target="_blank">📄 打开幕布卡片文档</a>
    <a class="mubu-btn" href="${data.meta.long_docs.Q10.url}" target="_blank" style="background:#7d6b5a;margin-top:8px">📖 打开 Q10 长文档</a>
  `;
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  selectedCardId = null;
}
document.getElementById('drawer-close').onclick = closeDrawer;

// ==== 筛选 ====
function applyFilter() {
  document.querySelectorAll('.node').forEach(g => {
    const id = g.getAttribute('data-id');
    const card = data.cards.find(c => c.id === id);
    if (!card) return;
    const themes = [card.primary_theme, ...(card.sub_themes || [])];
    const show = currentFilter === 'all' || themes.includes(currentFilter);
    g.classList.toggle('dim', !show);
  });
  document.querySelectorAll('.edge, .edge-label').forEach(el => {
    const from = el.getAttribute('data-from');
    const to = el.getAttribute('data-to');
    const fromCard = data.cards.find(c => c.id === from);
    const toCard = data.cards.find(c => c.id === to);
    if (!fromCard || !toCard) return;
    const fromMatch = currentFilter === 'all' || [fromCard.primary_theme, ...(fromCard.sub_themes || [])].includes(currentFilter);
    const toMatch = currentFilter === 'all' || [toCard.primary_theme, ...(toCard.sub_themes || [])].includes(currentFilter);
    el.classList.toggle('dim', !(fromMatch && toMatch));
  });
}

// ==== 重置位置 ====
document.getElementById('reset-positions').onclick = () => {
  if (!confirm('重置所有卡片到初始位置?')) return;
  positions = {};
  data.cards.forEach(c => { positions[c.id] = { ...c.initial_position }; });
  savePositions();
  render();
};

// ==== 工具 ====
function darken(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const darken = (v) => Math.max(0, Math.floor(v * 0.7));
  return `#${darken(r).toString(16).padStart(2, '0')}${darken(g).toString(16).padStart(2, '0')}${darken(b).toString(16).padStart(2, '0')}`;
}

// ==== ESC 关抽屉 ====
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
});

// ==== 窗口缩放 ====
window.addEventListener('resize', () => {
  const svg = document.getElementById('canvas');
  const rect = svg.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
});

// ==== 启动 ====
load();
</script>
